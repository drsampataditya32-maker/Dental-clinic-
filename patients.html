<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
<title>Dr S Aditya</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700;800&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;touch-action:manipulation;}
body{background:#0a0f1e;color:#e2e8f0;font-family:'DM Sans',sans-serif;min-height:100vh;}
.shell{max-width:480px;margin:0 auto;min-height:100vh;position:relative;}
.header{background:linear-gradient(135deg,#1e3a5f,#0a0f1e);padding:20px 18px 16px;display:flex;justify-content:space-between;align-items:center;}
.header-name{font-size:18px;font-weight:800;color:#fff;}
.header-sub{font-size:12px;color:#7dd3fc;margin-top:2px;}
.bell-btn{background:transparent;border:none;font-size:24px;cursor:pointer;position:relative;padding:4px;}
.badge{position:absolute;top:-2px;right:-2px;background:#ef4444;color:#fff;font-size:10px;font-weight:700;border-radius:99px;padding:1px 5px;}
.stats-row{display:flex;gap:10px;padding:12px 18px 0;}
.stat-box{flex:1;background:#111827;border-radius:12px;padding:10px 12px;text-align:center;}
.stat-value{font-size:22px;font-weight:800;color:#a78bfa;}
.stat-label{font-size:10px;color:#64748b;margin-top:2px;text-transform:uppercase;letter-spacing:.5px;}
.search-row{padding:12px 18px 0;}
.search-input{width:100%;background:#111827;border:1px solid #1e293b;border-radius:10px;padding:10px 14px;color:#e2e8f0;font-size:14px;outline:none;font-family:inherit;}
.filter-row{display:flex;gap:8px;padding:10px 18px 0;}
.filter-btn{flex:1;padding:7px 0;border-radius:8px;border:1px solid #1e293b;background:#111827;color:#64748b;font-size:13px;font-weight:600;cursor:pointer;}
.filter-btn.active{background:#1e3a5f;color:#7dd3fc;border-color:#3b82f6;}
.list{padding:10px 18px 80px;}
.empty{color:#334155;text-align:center;padding:40px 0;font-size:14px;}
.card{background:#111827;border-radius:14px;padding:12px 14px;margin-bottom:10px;display:flex;align-items:center;gap:12px;cursor:pointer;border:1px solid #1e293b;}
.card.urgent{border-color:#f97316;box-shadow:0 0 0 1px #f97316;}
.avatar{width:42px;height:42px;border-radius:99px;background:linear-gradient(135deg,#3b82f6,#8b5cf6);display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:700;color:#fff;flex-shrink:0;}
.card-body{flex:1;min-width:0;}
.card-name{font-size:15px;font-weight:700;color:#f1f5f9;}
.card-meta{font-size:12px;color:#64748b;margin-top:2px;}
.card-treatment{font-size:11px;color:#94a3b8;margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.card-right{display:flex;flex-direction:column;align-items:flex-end;gap:4px;}
.clinic-pill{font-size:10px;font-weight:700;color:#7dd3fc;border-radius:6px;padding:2px 7px;text-transform:uppercase;letter-spacing:.5px;}
.urgent-dot{font-size:10px;color:#f97316;font-weight:700;}
.fab{position:fixed;bottom:24px;right:24px;width:56px;height:56px;border-radius:99px;background:linear-gradient(135deg,#3b82f6,#8b5cf6);color:#fff;font-size:28px;border:none;cursor:pointer;box-shadow:0 4px 20px rgba(59,130,246,.5);display:flex;align-items:center;justify-content:center;z-index:50;}
.page{display:none;flex-direction:column;min-height:100vh;}
.page.active{display:flex;}
.detail-header{display:flex;justify-content:space-between;align-items:center;padding:16px 18px 8px;background:#0a0f1e;position:sticky;top:0;z-index:10;}
.back-btn{background:transparent;border:none;color:#7dd3fc;font-size:15px;cursor:pointer;font-weight:600;font-family:inherit;}
.edit-btn{background:#1e293b;border:none;color:#94a3b8;font-size:13px;cursor:pointer;padding:6px 14px;border-radius:8px;font-weight:600;font-family:inherit;}
.hero{display:flex;gap:16px;padding:10px 18px 14px;background:#111827;border-bottom:1px solid #1e293b;}
.hero-avatar{width:60px;height:60px;border-radius:99px;background:linear-gradient(135deg,#3b82f6,#8b5cf6);display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:700;color:#fff;flex-shrink:0;}
.hero-name{font-size:18px;font-weight:800;color:#f1f5f9;}
.hero-meta{font-size:13px;color:#64748b;margin-top:3px;}
.tab-row{display:flex;border-bottom:1px solid #1e293b;padding:0 18px;}
.tab{flex:1;padding:12px 0;background:transparent;border:none;color:#64748b;font-size:13px;font-weight:600;cursor:pointer;border-bottom:2px solid transparent;font-family:inherit;}
.tab.active{color:#7dd3fc;border-bottom-color:#3b82f6;}
.tab-content{flex:1;overflow-y:auto;padding:14px 18px 120px;}
.tab-pane{display:none;}
.tab-pane.active{display:block;}
.info-section{background:#111827;border-radius:12px;padding:12px 14px;border:1px solid #1e293b;margin-bottom:12px;}
.info-title{font-size:11px;color:#475569;text-transform:uppercase;letter-spacing:.8px;font-weight:700;margin-bottom:10px;}
.info-row{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:7px;gap:12px;}
.info-label{font-size:12px;color:#64748b;flex-shrink:0;min-width:100px;}
.info-value{font-size:13px;color:#cbd5e1;text-align:right;word-break:break-word;}
.detail-actions{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:#0a0f1e;border-top:1px solid #1e293b;padding:12px 18px;display:flex;flex-direction:column;gap:8px;z-index:20;}
.wa-btn{background:#25d366;color:#fff;border:none;border-radius:10px;padding:12px 18px;font-size:14px;font-weight:700;cursor:pointer;text-align:center;text-decoration:none;display:block;font-family:inherit;}
.delete-btn{background:transparent;color:#ef4444;border:1px solid #ef4444;border-radius:10px;padding:9px 18px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;}
.add-visit-btn{background:#1e3a5f;border:1px solid #3b82f6;color:#7dd3fc;border-radius:10px;padding:9px 18px;font-size:14px;font-weight:700;cursor:pointer;margin-bottom:12px;width:100%;font-family:inherit;}
.visit-card{background:#111827;border-radius:12px;padding:12px 14px;margin-bottom:10px;border:1px solid #1e293b;}
.visit-date{font-size:11px;color:#475569;text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px;}
.visit-treatment{font-size:15px;font-weight:700;color:#f1f5f9;}
.visit-meta{font-size:12px;color:#94a3b8;margin-top:4px;}
